name: Desktop regression checks

on:
  push:
    branches: [main, fix/pc-input-native-vision, feat/group-live-input]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # bun.lock is the lockfile: fail if it is out of date instead of silently resolving new versions.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm run check
      # The .cjs suites run on node (npm test); the .ts suites run on bun.
      # Glob instead of naming files, so a new test is never silently skipped.
      # shell: bash so the glob expands on the windows-latest runner too, where
      # the default PowerShell passes it to bun unexpanded.
      - run: npm test
      - run: npx --yes bun@1.4.2 test --isolate ./tests/*.test.ts
        shell: bash
      # bunx, not npx: with a bun-installed node_modules npx on Windows can miss the local tsc and fetch the wrong package.
      - run: bunx tsc --noEmit -p .
      - run: npx --yes bun@1.4.2 run build
      # Every require('./...') in the packaged app/*.cjs must resolve to a file build.ts copied.
      - run: node --test tests/build/requires.test.cjs
      # A full artifact-storage quota must not fail the build (or block the release step below):
      # the artifact is a convenience copy, the release asset is the real output.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hermes-bots-app-${{ runner.os }}
          path: app/
          retention-days: 7

  # Boots the built app under Electron (headless, xvfb) and fails on a crash, a missing module or a
  # timeout. Catches packaging mistakes that unit tests can't see.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx --yes bun@1.4.2 run build
      - run: xvfb-run -a node tests/build/smoke.cjs
        env:
          SMOKE_TIMEOUT_MS: '90000'

  # Builds the real NSIS installer, installs it silently on a Windows runner and boots the INSTALLED
  # app with HERMES_BOTS_SMOKE=1 (fails without HERMES_BOTS_SMOKE_OK). Catches packaging mistakes
  # (asar contents, missing files, electron-builder config) the dev-Electron smoke job can't see.
  windows-packaged:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Build installer (unsigned)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke-test the installed app
        shell: bash
        run: .github/scripts/smoke-windows-installer.sh
      - name: SHA256 of the installer
        shell: bash
        run: cd dist && sha256sum NexurBots-Setup-*.exe | tee SHA256SUMS.txt
      # Convenience copy for testing a PR build; allowed to fail while artifact storage is full.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hermes-bots-windows-installer-pr
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 7
